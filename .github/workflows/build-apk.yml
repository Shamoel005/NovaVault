name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install and build web app
        run: |
          npm install
          npm run build

      - name: Create and harden Android project
        run: |
          npx cap add android
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i '/android.permission.INTERNET/d' "$MANIFEST"
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' "$MANIFEST"
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NovaVault.apk

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: NovaVault-apk
          path: NovaVault.apk

      - name: Publish release (only for tags like v1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: NovaVault.apk
